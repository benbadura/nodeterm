name: Release

# Publish a release in GitHub first; attach unsigned installers to that same release.
# Do not create/promote releases or replace their user-authored release notes here.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build again (e.g. v0.3.9)'
        required: true
        type: string

permissions:
  contents: write # Upload assets to the existing release using GITHUB_TOKEN.

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  installers:
    name: Unsigned installers (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      # A failure on one platform must not cancel the other builds; rerun failed jobs.
      fail-fast: false
      matrix:
        include:
          - target: mac
            os: macos-15
          - target: linux
            os: ubuntu-24.04
          - target: win
            os: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # Manual reruns must build the release tag, not the selected workflow branch.
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Verify existing release and package version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          if (process.env.RELEASE_TAG.replace(/^v/, '') !== version) {
            throw new Error(`Release tag ${process.env.RELEASE_TAG} must match package.json version ${version}`)
          }
          NODE

      - name: Install Linux packaging tools
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies and rebuild native modules
        run: npm ci

      # dist:* explicitly disable the updater and electron-builder publishing.
      # dist:mac also disables Developer ID signing/notarization and builds universal tmux.
      # No Apple certificates, notarization credentials or Windows signing service needed.
      - name: Build unsigned installers
        env:
          TARGET: ${{ matrix.target }}
        run: npm run "dist:$TARGET"

      - name: Exercise packaged macOS runtime
        if: matrix.target == 'mac'
        run: |
          app_dir=dist/mac
          if [ "$(node -p process.arch)" = arm64 ]; then app_dir=dist/mac-arm64; fi
          ELECTRON_RUN_AS_NODE=1 "$app_dir/nodeterm.app/Contents/MacOS/nodeterm" scripts/package-smoke.cjs

      - name: Exercise Linux AppImage runtime
        if: matrix.target == 'linux'
        run: |
          chmod +x dist/*.AppImage
          dist/*.AppImage --appimage-extract > /dev/null
          ELECTRON_RUN_AS_NODE=1 squashfs-root/nodeterm scripts/package-smoke.cjs

      - name: Exercise Windows installer, upgrade, ZIP and uninstall
        if: matrix.target == 'win'
        shell: pwsh
        run: ./scripts/smoke-windows.ps1

      - name: Hash and attach installers to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          shopt -s nullglob
          case "$TARGET" in
            mac) assets=(dist/*.dmg dist/*.zip); expected=4 ;;
            linux) assets=(dist/*.AppImage dist/*.deb dist/*.rpm); expected=3 ;;
            win) assets=(dist/*.exe dist/*.zip); expected=2 ;;
            *) exit 1 ;;
          esac
          if [ "${#assets[@]}" -ne "$expected" ]; then
            echo "::error::Expected $expected installers/archives for $TARGET, found ${#assets[@]}"
            exit 1
          fi
          for asset in "${assets[@]}"; do test -s "$asset"; done
          node scripts/package-checksums.mjs "$TARGET"
          assets+=("dist/SHA256SUMS-$TARGET.txt")
          # Release assets are the canonical store. Avoid a second, billed Actions artifact copy.
          # Never upload latest*.yml or blockmaps for these unsigned, manually updated builds.
          for attempt in 1 2 3; do
            if gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          echo "::error::Release asset upload failed after 3 attempts"
          exit 1
